<!DOCTYPE html>
<html>
  <head>
    <title>Resume Extractor</title>
    <script src="pdf.min.js"></script>
    <style>
      body {
        background-color: black;
        color: rgb(179, 179, 179);
        font-family: Arial, sans-serif;
        padding: 20px;
        width: 300px;
      }
      h2 {
        font-size: 16px;
        margin-bottom: 10px;
      }
      input[type="file"] {
        margin-bottom: 10px;
      }
      button {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 4px;
        cursor: pointer;
        margin-right: 5px;
      }
      button:hover {
        background-color: #0056b3;
      }

      .yet{
        display: flex;
        justify-content: space-between;
        margin-top: 10px;
      }

      ::-webkit-scrollbar {
        width: 5px;
      }

      ::-webkit-scrollbar-track {
        background: rgba(217, 217, 217, 0.1);
        border-radius: 10px;
      }

      ::-webkit-scrollbar-thumb {
        background: #888;
        border-radius: 20px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #555;
      }

      #status {
        margin-top: 10px;
        color: rgb(0, 163, 0);
        font-size: 12px;
      }
      #previewSection {
        margin-top: 15px;
        max-height: 200px;
        overflow-y: auto;
        border-top: 1px solid #eee;
        padding-top: 10px;
      }
      #entityPreview {
        font-size: 12px;
        margin-bottom: 10px;
      }
      .entity-group {
        margin-bottom: 5px;
      }
      .entity-type {
        font-weight: bold;
      }
      .hidden {
        display: none;
      }
      #fieldMappingSection {
        margin-top: 15px;
        border-top: 1px solid #eee;
        padding-top: 10px;
      }
      .mapping-item {
        margin-bottom: 5px;
        padding: 5px;
        background: #f5f5f5;
        border-radius: 3px;
      }
      .mapping-select {
        margin-left: 10px;
        min-width: 150px;
      }
    </style>
  </head>
  <body>
    <h2>Upload Resume</h2>
    <input type="file" id="resumeUpload" accept=".txt, .pdf" />
    <div class="yet">
      <button id="extractButton">Extract Entities</button>
      <button id="confirmFill">Fill Form</button>
    </div>

    <div id="status"></div>

    <div id="previewSection" class="hidden">
      <h3>Extracted Data Preview</h3>
      <div id="entityPreview"></div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
