<!DOCTYPE html>
<html>
  <head>
    <title>ResumeFillAssist</title>
    <script src="pdf.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h4 class="montserrat-font">
      Hello! Welcome to ResumeFillAssist,<br />an AI-powered tool to help you
      fill out job applications.
    </h4>
    <h2>Upload the Resume</h2>
    <label for="resumeUpload" id="drop-area">
      <input type="file" accept=".txt, .pdf" id="resumeUpload" hidden />
      <div id="img-view">
        <img src="upload.png" height="100px" alt="Upload icon" />
        <p>Drag and drop or click here<br /><br />to upload a resume pdf</p>
      </div>
    </label>

    <div class="yet">
      <button id="extractButton">Extract Entities</button>
      <button id="confirmFill">Fill Form</button>
    </div>

    <div id="status"></div>

    <div id="previewSection" class="hidden">
      <h3>Extracted Data Preview</h3>
      <div id="entityPreview"></div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
